services:
  # 1. MySQL Database Container
  db:
    image: mysql:8.4
    container_name: skillgarden_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: skillgarden_dev
      MYSQL_DATABASE: db_skill_garden
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./skill_garden-Backend/database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql

  # 2. PHP 8.3 Backend API Container
  backend:
    build:
      context: ./skill_garden-Backend
      dockerfile: Dockerfile
    container_name: skillgarden_backend
    restart: always
    ports:
      - "8000:80"
    environment:
      DB_HOST: db
      DB_DATABASE: db_skill_garden
      DB_USERNAME: root
      DB_PASSWORD: skillgarden_dev
    depends_on:
      - db
    volumes:
      - ./skill_garden-Backend:/var/www/html

  # 3. React 19 Frontend Container
  frontend:
    build:
      context: ./skill_garden-Frontend
      dockerfile: Dockerfile
    container_name: skillgarden_frontend
    restart: always
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  mysql_data:
